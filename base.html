<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}株価変動アラート{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0A0E13; --surface:#111820; --surface-2:#17202A; --surface-3:#1E2A36;
  --line:#26313D; --line-soft:#1B242E;
  --text:#E8EFF5; --dim:#93A4B3; --faint:#61717F;
  --up:#34D399; --up-bg:#0C3229; --down:#FB7185; --down-bg:#3A1A22;
  --amber:#FBBF24; --blue:#60A5FA;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ink); color:var(--text); font-family:var(--sans);
  font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------- top bar ---------- */
.topbar{
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  padding:14px 22px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#121A23,#0E151C);position:sticky;top:0;z-index:20;
}
.brand{display:flex;align-items:center;gap:11px;font-weight:900;letter-spacing:.02em;font-size:16px}
.brand .glyph{display:flex;gap:2px;align-items:flex-end;height:20px}
.brand .glyph i{width:5px;border-radius:1px;background:var(--up);display:block}
.brand .glyph i:nth-child(1){height:7px;opacity:.45}
.brand .glyph i:nth-child(2){height:11px;opacity:.65}
.brand .glyph i:nth-child(3){height:15px;opacity:.85}
.brand .glyph i:nth-child(4){height:20px}
.brand small{display:block;font-size:10px;font-weight:500;color:var(--faint);letter-spacing:.14em}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a{
  color:var(--dim);padding:7px 13px;border-radius:8px;font-size:13px;font-weight:700;
  border:1px solid transparent;
}
.nav a:hover{background:var(--surface-2);color:var(--text);text-decoration:none}
.nav a.on{background:var(--surface-3);color:var(--text);border-color:var(--line)}

/* ---------- system strip ---------- */
.strip{
  display:flex;align-items:center;gap:0;flex-wrap:wrap;
  border-bottom:1px solid var(--line-soft);background:var(--surface);
  font-size:12px;color:var(--dim);
}
.strip .cell{padding:9px 16px;border-right:1px solid var(--line-soft);display:flex;gap:7px;align-items:center}
.strip .cell b{color:var(--text);font-family:var(--mono);font-weight:500}
.strip form{margin-left:auto;padding:7px 16px}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:p 2.2s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(52,211,153,.5)}70%{box-shadow:0 0 0 8px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}

/* ---------- buttons ---------- */
.btn{
  font-family:var(--sans);font-size:13px;font-weight:700;cursor:pointer;
  padding:8px 15px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--text);transition:.15s;
}
.btn:hover{background:var(--surface-3);border-color:#33414f}
.btn.primary{background:var(--up);border-color:var(--up);color:#04150F}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--dim)}
.btn.danger{color:var(--down);border-color:#40232B;background:transparent}
.btn.danger:hover{background:var(--down-bg)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:6px}

/* ---------- layout ---------- */
.wrap{max-width:1280px;margin:0 auto;padding:22px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
@media (max-width:960px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card > h2{
  margin:0;padding:13px 16px;font-size:13px;font-weight:700;letter-spacing:.08em;
  color:var(--dim);text-transform:uppercase;border-bottom:1px solid var(--line-soft);
  display:flex;align-items:center;gap:9px;
}
.card > h2 .cnt{font-family:var(--mono);color:var(--faint);font-weight:500;letter-spacing:0}
.pad{padding:16px}

/* ---------- flash ---------- */
.flash{padding:11px 15px;border-radius:8px;margin-bottom:10px;font-size:13px;border:1px solid}
.flash.ok{background:var(--up-bg);border-color:#1C5C48;color:#8BE8C4}
.flash.info{background:var(--surface-2);border-color:var(--line);color:var(--dim)}
.flash.err{background:var(--down-bg);border-color:#5C2531;color:#FCA5B5}

/* ---------- watch rows ---------- */
.rows{display:flex;flex-direction:column}
.row{
  display:grid;
  grid-template-columns:minmax(120px,1.35fr) 96px 96px 84px 118px 1fr auto;
  gap:10px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line-soft);
  transition:background .15s;
}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row.off{opacity:.42}
.row.hot{background:linear-gradient(90deg,rgba(251,191,36,.07),transparent 55%)}
.head{
  font-size:11px;letter-spacing:.08em;color:#A6B7C6;text-transform:uppercase;
  border-bottom:1px solid var(--line);font-weight:700;
}
.head:hover{background:transparent}
.legend{
  margin-left:auto;font-size:11px;font-weight:500;letter-spacing:0;
  color:var(--faint);text-transform:none;
}
.sym{font-family:var(--mono);font-weight:700;font-size:14px;display:block}
.nm{font-size:11.5px;color:var(--dim);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbl{display:none}
.chg{font-family:var(--mono);font-weight:700;font-size:14px}
.chg.up{color:var(--up)} .chg.down{color:var(--down)} .chg.flat{color:var(--faint)}
.px{font-family:var(--mono);color:var(--text)}

/* ---------- ladder (signature) ---------- */
.ladder{display:flex;gap:3px;align-items:center}
.ladder.down{flex-direction:row-reverse}
.ladder .t{
  width:22px;height:22px;border-radius:4px;display:grid;place-items:center;
  font-family:var(--mono);font-size:9px;font-weight:700;
  background:var(--surface-3);color:var(--faint);border:1px solid var(--line);
}
.ladder.up .t.on{background:var(--up);border-color:var(--up);color:#04150F}
.ladder.down .t.on{background:var(--down);border-color:var(--down);color:#2A0810}
.ladder .t.now{outline:2px solid var(--amber);outline-offset:1px}

/* ---------- badge ---------- */
.badge{
  display:inline-block;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px;
  border:1px solid var(--line);color:var(--faint);white-space:nowrap;
}
.badge.up{background:var(--up-bg);border-color:#1C5C48;color:#7FE3BD}
.badge.down{background:var(--down-bg);border-color:#5C2531;color:#FDA4B4}
.badge.warn{background:#3A2E0B;border-color:#6B5311;color:var(--amber)}
.badge.err{background:var(--down-bg);border-color:#5C2531;color:#FDA4B4}
.acts{display:flex;gap:4px;justify-content:flex-end}

/* ---------- forms ---------- */
label{display:block;font-size:11.5px;color:var(--dim);margin:0 0 5px;font-weight:700;letter-spacing:.03em}
input[type=text],input[type=number],input[type=password],select,textarea{
  width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--line);
  background:var(--ink);color:var(--text);font-family:var(--sans);font-size:13.5px;
}
input.num{font-family:var(--mono)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
.f{margin-bottom:13px}
.hint{font-size:11px;color:var(--faint);margin-top:5px;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);font-weight:700}
.chk input{width:auto;accent-color:var(--up)}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;margin:0 0 14px}
legend{font-size:11.5px;font-weight:900;letter-spacing:.1em;color:var(--amber);padding:0 7px;text-transform:uppercase}

/* ---------- empty ---------- */
.empty{padding:44px 20px;text-align:center;color:var(--faint)}
.empty strong{display:block;color:var(--dim);font-size:15px;margin-bottom:6px}

/* ---------- alerts list ---------- */
.al{border-bottom:1px solid var(--line-soft);padding:13px 16px}
.al:last-child{border-bottom:0}
.al .t{font-weight:700;font-size:13.5px;margin-bottom:3px}
.al .m{font-size:12px;color:var(--dim);white-space:pre-wrap;font-family:var(--mono);line-height:1.65}
.al .meta{font-size:11px;color:var(--faint);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}
.sec{font-size:11px;color:var(--faint);letter-spacing:.12em;text-transform:uppercase;font-weight:900;margin:26px 0 10px}
code{font-family:var(--mono);background:var(--surface-3);padding:1px 6px;border-radius:4px;font-size:12px}
@media (max-width:820px){
  .row{grid-template-columns:1fr 1fr;gap:6px 12px}
  .row.head{display:none}
  .lbl{display:block;font-size:10px;color:var(--faint);letter-spacing:.08em}
  .acts{grid-column:1/-1}
  .two{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="glyph"><i></i><i></i><i></i><i></i></span>
    <span>株価変動アラート<small>STOCK VOLATILITY MONITOR</small></span>
  </div>
  <nav class="nav">
    <a href="{{ url_for('index') }}" class="{{ 'on' if request.endpoint=='index' }}">監視リスト</a>
    <a href="{{ url_for('alerts_page') }}" class="{{ 'on' if request.endpoint=='alerts_page' }}">アラート履歴</a>
    <a href="{{ url_for('settings_page') }}" class="{{ 'on' if request.endpoint=='settings_page' }}">設定</a>
  </nav>
</header>
{% block strip %}{% endblock %}
<div class="wrap">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  {% block body %}{% endblock %}
</div>
</body>
</html>
